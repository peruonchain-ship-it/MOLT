[project]
name = "molt-radar"
version = "0.1.0"
description = "Radar privado de contrataciones para eventos y servicios audiovisuales en Perú"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pypdf==6.10.0",
  "python-dotenv==1.2.2",
  "psycopg[binary]>=3.2,<4",
  "certifi>=2026.6.17",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "playwright==1.62.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
