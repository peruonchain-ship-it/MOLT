name: Actualizar DATALICITA
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datalicita-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MOLT_MAIL_FROM: ${{ secrets.MOLT_MAIL_FROM }}
      MOLT_WORKER_ENABLED: 'false'
      MOLT_DATA_DIR: /tmp/datalicita-collector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verificar configuración privada
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'Falta DATABASE_URL en Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Instalar dependencias bloqueadas
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --no-dev
      - name: Consultar fuente, revisar adjuntos y procesar resumen
        run: uv run --frozen --no-dev python -m molt collect
